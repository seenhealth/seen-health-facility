# Type check, every model/simulation/renderer validator, unit tests and both
# production builds, on every push and pull request. Runs offline after
# `npm ci`: no private source documents, canvas runtime or git history needed.
name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run test:unit
      - run: npm run build
      - run: npm run build:story
