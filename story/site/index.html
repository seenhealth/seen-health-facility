<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>A day at Seen Health</title>
    <meta
      name="description"
      content="Scroll through one participant’s day at the Seen Health PACE center in Alhambra, and see how an eleven-person interdisciplinary team plans, delivers and oversees her care."
    />
    <meta name="theme-color" content="#F3F0E9" />
    <meta property="og:title" content="A day at Seen Health" />
    <meta
      property="og:description"
      content="One day. Eleven people. One life, fully seen."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      html { background: #f3f0e9; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="story">
      <!-- First paint before JavaScript: the opening typography (replaced by React). -->
      <div class="story-root" data-status="loading">
        <div class="story-stage" aria-hidden="true"><div class="story-fallback"></div></div>
        <main class="story-main">
          <section class="story-beat story-opening" aria-labelledby="story-title">
            <div class="story-pin">
              <div class="story-opening-copy">
                <p class="story-eyebrow">A day at Seen Health · Alhambra, California</p>
                <h1 id="story-title" class="story-display">
                  <span>One day.</span> <span>Eleven people.</span>
                  <span class="accent">One life, fully seen.</span>
                </h1>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
